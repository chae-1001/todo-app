<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="개인 할 일 관리 앱 — My Tasks" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="app">

    <!-- ── 헤더: 제목 / 남은 배지 / 도구 ── -->
    <div class="header-row">
      <div class="title-group">
        <h1 class="title">My Tasks</h1>
        <span id="remaining-badge" class="remaining-badge" aria-label="남은 할 일 수" hidden>0</span>
      </div>
      <div class="header-tools">
        <button id="export-btn" class="icon-btn" title="JSON으로 내보내기" aria-label="데이터 내보내기">↓</button>
        <button id="import-btn" class="icon-btn" title="JSON에서 가져오기" aria-label="데이터 가져오기">↑</button>
        <!-- 실제 파일 선택은 JS에서 import-btn 클릭 시 트리거 -->
        <input type="file" id="import-file" accept=".json" hidden aria-hidden="true" tabindex="-1" />
        <span class="v-divider" aria-hidden="true"></span>
        <button id="theme-btn" class="theme-btn" title="다크 모드 (Alt+D)" aria-label="테마 전환">
          <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
          <span id="theme-icon" class="theme-icon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>

    <!-- ── 오늘의 격언 (JS에서 동적 삽입) ── -->
    <blockquote id="quote-bar" class="quote-bar" aria-label="오늘의 격언">
      <p id="quote-text" class="quote-text"></p>
      <footer id="quote-author" class="quote-author"></footer>
    </blockquote>

    <!-- ── 진행률 대시보드 ── -->
    <section id="dashboard" class="dashboard" aria-labelledby="dash-heading">
      <div class="dash-overview">
        <div class="dash-row">
          <span id="dash-heading" class="dash-label">전체 진행률</span>
          <span id="dash-summary" class="dash-summary">0/0 완료 (0%)</span>
          <span id="dash-today"   class="dash-today">오늘 추가 0개</span>
        </div>
        <div id="dash-bar-track" class="dash-bar-track"
             role="progressbar" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-label="전체 완료율">
          <div id="dash-bar" class="dash-bar"></div>
        </div>
        <!-- 완료율에 따른 응원 메시지 -->
        <p id="encouragement" class="encouragement" aria-live="polite"></p>
      </div>
      <div id="dash-cats" class="dash-cats" aria-label="카테고리별 진행률"></div>
    </section>

    <!-- ── 필터(Alt+1~4) + 정렬 드롭다운 ── -->
    <div class="toolbar" role="toolbar" aria-label="필터 및 정렬">
      <div id="filter-bar" class="filter-bar" role="group" aria-label="카테고리 필터">
        <button class="filter-btn active" data-filter="전체" aria-pressed="true">전체</button>
        <button class="filter-btn" data-filter="업무"  aria-pressed="false">업무</button>
        <button class="filter-btn" data-filter="개인"  aria-pressed="false">개인</button>
        <button class="filter-btn" data-filter="공부"  aria-pressed="false">공부</button>
      </div>
      <label class="sort-label">
        <span class="sr-only">정렬 기준</span>
        <select id="sort-select" class="sort-select" aria-label="정렬 기준">
          <option value="status">완료순</option>
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="category">카테고리순</option>
          <option value="manual">⠿ 수동 정렬</option>
        </select>
      </label>
    </div>

    <!-- ── 실시간 검색 ── -->
    <div class="search-row">
      <input id="search-input" class="search-input" type="search"
             placeholder="검색…" aria-label="할 일 검색" autocomplete="off" />
    </div>

    <!-- ── 새 할 일 입력 ── -->
    <div class="input-row">
      <div class="category-wrap">
        <select id="category-select" class="category-select" aria-label="카테고리 선택">
          <option value="업무">업무</option>
          <option value="개인">개인</option>
          <option value="공부">공부</option>
        </select>
        <!-- 키워드 자동 분류 시 표시되는 인디케이터 -->
        <span id="auto-cat-indicator" class="auto-cat-indicator" hidden aria-hidden="true">자동 분류</span>
      </div>
      <input id="todo-input" class="todo-input" type="text"
             placeholder="할 일을 입력하세요 (Alt+N)" maxlength="200"
             aria-label="새 할 일 내용" autocomplete="off" />
      <button id="add-btn" class="add-btn" aria-label="할 일 추가">추가</button>
    </div>

    <!-- ── 할 일 목록 ── -->
    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>

    <!-- ── 하단: 완료 항목 일괄 삭제 ── -->
    <div id="list-footer" class="list-footer" hidden>
      <button id="clear-btn" class="clear-btn" aria-label="완료된 모든 항목 삭제">
        완료된 항목 모두 삭제
      </button>
    </div>

  </div><!-- /.card -->

  <!-- ── 범용 확인 모달 (버튼은 JS에서 동적 생성) ── -->
  <div id="confirm-modal" class="modal-overlay"
       role="dialog" aria-modal="true" aria-labelledby="modal-msg" hidden>
    <div class="modal">
      <p id="modal-msg" class="modal-msg"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- ── 토스트 (실행 피드백 + Undo 버튼 포함 가능) ── -->
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ── 스크린리더 전용 즉시 공지 ── -->
  <div id="sr-live" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
